<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <title>User List</title>
</head>
<body>
    <div class="container d-flex justify-content-end mt-4 mb-2">
        <div class="btn-group">
            <button class="btn btn-secondary" data-bs-theme-value="dark">Dark</button>
            <button class="btn btn-light" data-bs-theme-value="light">Light</button>
        </div>
    </div>

    <div class="container">
        <h2>User</h2>
        <div class="row">
            <div class="col-md-4 col-12">
                <input type="text" class="form-control" placeholder="Search Users">
            </div>
            <div class="col-md-8 col-12 user-menu d-flex justify-content-end align-items-center">
                <ul class="nav">
                    <li class="nav-item">
                        <a class="nav-link active" href="#">Reputation</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-bg-primary rounded-3" href="#">New Users</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Editors</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Moderators</a>
                    </li>
                </ul>
            </div>
        </div>
    </div>



    <script src="js/darkModeToggle.js"></script>
</body>
</html>
